name: VS Code Extension Release

# Build the downstream composed server and bundle it with each native VSIX.
# Publish the pinned chatter-clan revision and its Chatter dependency first.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CLAN_SERVER_REVISION: c616a41632f7e872949605d58834a3b63f604368

jobs:
  package:
    name: Package ${{ matrix.vsce_target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - vsce_target: darwin-arm64
            rust_target: aarch64-apple-darwin
            runner: macos-15
            executable: chatter-clan-lsp
          - vsce_target: darwin-x64
            rust_target: x86_64-apple-darwin
            runner: macos-15-intel
            executable: chatter-clan-lsp
          - vsce_target: linux-x64
            rust_target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            executable: chatter-clan-lsp
          - vsce_target: linux-arm64
            rust_target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            executable: chatter-clan-lsp
          - vsce_target: win32-x64
            rust_target: x86_64-pc-windows-msvc
            runner: windows-2025
            executable: chatter-clan-lsp.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Check out the composed server
        uses: actions/checkout@v7
        with:
          repository: TalkBank/chatter-clan
          ref: ${{ env.CLAN_SERVER_REVISION }}
          path: clan-server

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build the composed server
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        working-directory: clan-server
        run: cargo build --release --locked -p chatter-clan-lsp --target "$RUST_TARGET"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stage the composed server
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          SERVER_EXECUTABLE: ${{ matrix.executable }}
        run: |
          source="clan-server/target/$RUST_TARGET/release/$SERVER_EXECUTABLE"
          if [[ "$SERVER_EXECUTABLE" == *.exe ]]; then
            node scripts/prepare-server.mjs --source "$source" --windows
          else
            node scripts/prepare-server.mjs --source "$source"
          fi
          rm -rf clan-server

      - name: Package VSIX
        env:
          VSCE_TARGET: ${{ matrix.vsce_target }}
        run: npm run "package:${VSCE_TARGET}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.vsce_target }}
          path: '*.vsix'
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          path: vsix
          merge-multiple: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" vsix/*.vsix \
            --repo "$REPO" \
            --title "TalkBank CHAT for VS Code $TAG" \
            --notes "Per-platform VSIX builds bundle the composed CLAN/editor server from chatter-clan ${CLAN_SERVER_REVISION}. Install the VSIX matching your OS and architecture."
